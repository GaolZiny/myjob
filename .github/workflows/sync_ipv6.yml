name: Sync ipv6.m3u and Insert Custom Lines

on:
  schedule:
    - cron: '0 3 * * *'  # 每天日本时间中午12点执行（UTC时间03:00）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v3

      - name: Download upstream ipv6.m3u
        run: |
          curl -sL https://raw.githubusercontent.com/fanmingming/live/refs/heads/main/tv/m3u/ipv6.m3u -o ipv6.m3u

      - name: Insert custom lines from local file after 2nd line
        run: |
          head -n 1 ipv6.m3u > generated_ipv6.m3u
          cat insert_custom_lines.txt >> generated_ipv6.m3u
          tail -n +2 ipv6.m3u >> generated_ipv6.m3u

      - name: Append content from iptv.m3u (lines from 6 onward)
        run: |
          curl -sL https://raw.githubusercontent.com/Kimentanm/aptv/refs/heads/master/m3u/iptv.m3u -o iptv.m3u
          tail -n +6 iptv.m3u >> generated_ipv6.m3u

      - name: Drop IPv6 entries (ISP in Japan has no IPv6)
        run: |
          # 每个频道 = 若干 # 开头的行 + 一行地址；地址以 scheme://[ 开头的是 IPv6，整条丢弃
          awk '/^#EXTM3U/{print;next}
               /^#/{buf=buf $0 "\n"; next}
               /^[[:space:]]*$/{next}
               { if ($0 !~ /^[a-zA-Z]+:\/\/\[/) printf "%s%s\n", buf, $0; buf="" }' \
            generated_ipv6.m3u > filtered.m3u

      - name: Drop dead channels (liveness check)
        run: |
          python3 - filtered.m3u checked.m3u <<'PY'
          import sys, urllib.request, urllib.parse, concurrent.futures as cf

          src, dst = sys.argv[1], sys.argv[2]
          header, entries, buf = None, [], []
          for line in open(src, encoding="utf-8", errors="replace"):
              line = line.rstrip("\r\n")
              if line.startswith("#EXTM3U"):
                  header = line
              elif line.startswith("#"):
                  buf.append(line)
              elif line.strip():
                  entries.append((buf, line.strip()))
                  buf = []

          def alive(url):
              # 能用 = 200 且内容像播放列表 / 视频流；超时 10 秒
              try:
                  # 地址里有中文等非 ASCII 字符时先转码（播放器也会这样做），已转码的 %xx 不动
                  url = urllib.parse.quote(url, safe=":/?#[]@!$&'()*+,;=%~")
                  req = urllib.request.Request(url, headers={"User-Agent": "AppleCoreMedia/1.0.0 (Apple TV; tvOS 18)"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      if r.status != 200:
                          return False, f"HTTP {r.status}"
                      head = r.read(4096)
                      ctype = (r.headers.get("Content-Type") or "").lower()
              except Exception as e:
                  return False, type(e).__name__ + ": " + str(e)[:80]
              if b"#EXTM3U" in head or head[:1] == b"\x47" or head[:3] == b"FLV":
                  return True, ""
              if any(k in ctype for k in ("mpegurl", "video/", "mp2t", "octet-stream")):
                  return True, ""
              return False, f"not a stream (Content-Type: {ctype or '-'})"

          with cf.ThreadPoolExecutor(max_workers=16) as ex:
              results = list(ex.map(lambda e: alive(e[1]), entries))

          dead = [(e, why) for e, (ok, why) in zip(entries, results) if not ok]
          name = lambda e: next((m.rsplit(",", 1)[-1] for m in e[0] if m.startswith("#EXTINF")), "?")
          print(f"checked {len(entries)}, dead {len(dead)}")
          for e, why in dead:
              print(f"  DEAD  {name(e)}  {e[1][:90]}  ({why})")

          # 保险：失效超过 90% 多半是检测这边的网络问题，保留原列表不删
          # （2026-11-24 从日本实测本来就有约 62% 失效，所以不能设 60%）
          if entries and len(dead) / len(entries) > 0.9:
              print("::warning::more than 90% dead, keeping the unfiltered list")
              keep = entries
          else:
              keep = [e for e, (ok, _) in zip(entries, results) if ok]

          with open(dst, "w", encoding="utf-8") as f:
              if header:
                  f.write(header + "\n")
              for meta, url in keep:
                  f.write("\n".join(meta + [url]) + "\n")
          PY

          mkdir -p generated
          mv checked.m3u generated/ipv6_custom.m3u

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/ipv6_custom.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ipv6_custom.m3u with latest source and custom lines"
          git push
